<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mathedu · 실시간 수업 모니터링 대시보드</title>
<style>
:root {
  --bg: #0d1020;
  --card: rgba(255, 255, 255, .10);
  --card2: rgba(255, 255, 255, .14);
  --line: rgba(255, 255, 255, .20);
  --txt: #eef2ff;
  --sub: #aab4d4;
  --accent: #7cc4ff;
  --accent2: #a78bfa;
  --good: #5eead4;
  --bad: #fb7185;
  --gold: #fde68a;
  --glass-blur: 22px;
  --glass-shadow: 0 8px 32px rgba(0,0,0,.40);
  --radius: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  color: var(--txt);
  line-height: 1.6;
  font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  background:
    radial-gradient(circle at 12% 8%, rgba(124,196,255,.35), transparent 42%),
    radial-gradient(circle at 88% 12%, rgba(167,139,250,.32), transparent 40%),
    radial-gradient(circle at 50% 55%, rgba(94,234,212,.18), transparent 45%),
    radial-gradient(circle at 20% 90%, rgba(253,230,138,.15), transparent 40%),
    linear-gradient(160deg, #0a0d1a 0%, #141833 50%, #0a0d1a 100%);
  background-attachment: fixed;
  min-height: 100vh;
}
.wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding: 24px 18px 80px;
}

/* 상단 네비게이션 */
.topbar {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  align-items: center;
}
.tbtn {
  background: var(--card2);
  color: var(--txt);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 16px;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  font-size: .88rem;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  transition: .15s;
}
.tbtn:hover { border-color: var(--accent); color: var(--accent); }

.live-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(62,220,151,.15);
  color: #3ddc97;
  border: 1px solid rgba(62,220,151,.35);
  border-radius: 20px;
  padding: 4px 14px;
  font-size: .78rem;
  font-weight: 700;
  margin-left: auto;
}
.live-dot {
  width: 8px;
  height: 8px;
  background: #3ddc97;
  border-radius: 50%;
  animation: pulse 1.5s infinite;
}
@keyframes pulse { 0%,100%{opacity:1; transform:scale(1)} 50%{opacity:.4; transform:scale(.8)} }

/* 헤더 & 수업 배너 */
.header-box {
  margin-bottom: 24px;
}
.room-banner {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(90deg, rgba(124,196,255,.2), rgba(167,139,250,.2));
  border: 1px solid rgba(124,196,255,.4);
  color: #eef2ff;
  border-radius: 30px;
  padding: 6px 18px;
  font-size: .95rem;
  font-weight: 700;
  margin-bottom: 10px;
  box-shadow: 0 0 20px rgba(124,196,255,.2);
}
h1 {
  font-size: 1.8rem;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-bottom: 6px;
}
.lead { color: var(--sub); font-size: .95rem; }

/* 툴바 컨트롤 */
.action-bar {
  display: flex;
  gap: 8px;
  margin: 16px 0 24px;
  flex-wrap: wrap;
  align-items: center;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 16px;
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
}
.btn {
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  color: #0b1020;
  border: none;
  border-radius: 10px;
  padding: 8px 16px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(124,196,255,.3);
  transition: .15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: .88rem;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(124,196,255,.45); }
.btn-sec {
  background: var(--card2);
  color: var(--txt);
  border: 1px solid var(--line);
  box-shadow: none;
}
.btn-sec:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
.btn-active {
  background: rgba(94,234,212,.2);
  border-color: var(--good);
  color: var(--good);
}

/* 통계 카드 그리드 */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 18px;
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  box-shadow: var(--glass-shadow);
}
.stat-card .num {
  font-size: 1.8rem;
  font-weight: 800;
  color: var(--accent);
}
.stat-card .lbl {
  font-size: .82rem;
  color: var(--sub);
  margin-top: 4px;
}

/* 필터 및 검색 */
.filter-row {
  display: flex;
  gap: 10px;
  margin-bottom: 18px;
  flex-wrap: wrap;
  align-items: center;
}
.filter-row select, .filter-row input {
  background: #1a2038;
  color: #e8ecf5;
  border: 1px solid #2e3850;
  border-radius: 10px;
  padding: 8px 14px;
  font-size: .88rem;
}
.tab-switch {
  display: inline-flex;
  background: #141833;
  border: 1px solid #2e3850;
  border-radius: 10px;
  padding: 3px;
  margin-left: auto;
}
.tab-btn {
  background: none;
  border: none;
  color: var(--sub);
  padding: 6px 14px;
  border-radius: 8px;
  font-size: .82rem;
  font-weight: 700;
  cursor: pointer;
}
.tab-btn.active {
  background: var(--accent);
  color: #0b1020;
}

/* 실시간 학생 카드 그리드 */
.student-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 14px;
  margin-bottom: 30px;
}
.student-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  box-shadow: var(--glass-shadow);
  transition: .2s;
  position: relative;
  overflow: hidden;
}
.student-card:hover {
  border-color: rgba(124,196,255,.4);
  transform: translateY(-2px);
}
.student-card .s-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.student-card .s-name {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--txt);
}
.student-card .s-status {
  font-size: .75rem;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 12px;
}
.status-done { background: rgba(94,234,212,.18); color: var(--good); border: 1px solid rgba(94,234,212,.3); }
.status-active { background: rgba(124,196,255,.18); color: var(--accent); border: 1px solid rgba(124,196,255,.3); }
.status-wait { background: rgba(255,255,255,.08); color: var(--sub); }

.s-bar-wrap {
  height: 8px;
  background: rgba(255,255,255,.1);
  border-radius: 6px;
  overflow: hidden;
  margin: 10px 0 8px;
}
.s-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--good));
  border-radius: 6px;
  transition: width .3s ease;
}
.s-meta {
  display: flex;
  justify-content: space-between;
  font-size: .8rem;
  color: var(--sub);
}
.s-time {
  font-size: .72rem;
  color: #7d8aa8;
  margin-top: 6px;
  text-align: right;
}

/* 테이블 뷰 */
table {
  width: 100%;
  border-collapse: collapse;
  font-size: .88rem;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
}
th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--line); }
th { color: var(--sub); font-weight: 600; background: rgba(255,255,255,.04); }
tr:hover td { background: rgba(124,196,255,.06); }

.pill {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 20px;
  font-size: .78rem;
  font-weight: 700;
}
.pill-high { background: rgba(62,220,151,.15); color: #3ddc97; }
.pill-mid { background: rgba(255,209,102,.15); color: #ffd166; }
.pill-low { background: rgba(255,107,107,.15); color: #ff6b6b; }

/* 빈 상태 */
.empty-box {
  text-align: center;
  padding: 60px 20px;
  color: var(--sub);
}

/* 로딩 스피너 */
.spin {
  width: 40px;
  height: 40px;
  border: 4px solid #2e3850;
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: sp 1s linear infinite;
  margin: 0 auto 12px;
}
@keyframes sp { to { transform: rotate(360deg); } }

/* 빔프로젝터 모달 */
.projector-modal {
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: #0a0d1a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
  animation: fadeIn .2s ease;
}
</style>
</head>
<body>
<div class="wrap">
  <!-- 상단 네비 -->
  <div class="topbar">
    <a class="tbtn" href="./">← 메인 게시판</a>
    <button class="tbtn" onclick="fetchData()">🔄 새로고침</button>
    <button class="tbtn" id="btnToggleAnon" onclick="toggleAnonymous()">🙈 익명 모드: OFF</button>
    <button class="tbtn" onclick="exportCsv()">📥 성적표 엑셀(CSV) 저장</button>
    <div class="live-badge"><span class="live-dot"></span> 3초 실시간 갱신 중</div>
  </div>

  <!-- 헤더 영역 -->
  <div class="header-box">
    <div id="roomBadgeContainer"></div>
    <h1 id="dashboardTitle">📊 실시간 수업 모니터링 대시보드</h1>
    <p class="lead" id="dashboardSubtitle">학생들의 실시간 퀴즈 풀이 진행 현황 및 성취도 관제</p>
  </div>

  <!-- 교사용 빠른 배포 액션 바 -->
  <div class="action-bar" id="roomActionBar" style="display:none">
    <span style="font-weight:700;color:var(--accent);font-size:.9rem">수업 배포 도구:</span>
    <button class="btn" id="btnProjector">🖥️ 칠판 빔프로젝터 QR 띄우기</button>
    <button class="btn btn-sec" id="btnCopyStudentLink">📋 학생 참여 링크 복사</button>
    <button class="btn btn-sec" onclick="location.href='dashboard-static.html'">🌐 전체 수업 모아보기</button>
  </div>

  <!-- 핵심 통계 카드 -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="num" id="statTotalStudents">-</div>
      <div class="lbl">👥 총 참여 학생</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statCompleted">-</div>
      <div class="lbl">🏆 완주 학생 (완주율)</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statAvgScore">-</div>
      <div class="lbl">📈 반 평균 정답률</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statActiveNow">-</div>
      <div class="lbl">🟢 현재 풀이 중 (최근 활동)</div>
    </div>
  </div>

  <!-- 필터 & 뷰 전환 -->
  <div class="filter-row">
    <select id="roomFilterSelect" onchange="onRoomSelectChange(this.value)">
      <option value="">모든 수업 (전체 보기)</option>
    </select>
    <select id="quizFilterSelect" onchange="applyFilters()">
      <option value="">모든 퀴즈</option>
    </select>
    <input type="text" id="nameFilterInput" placeholder="학생 이름 검색..." oninput="applyFilters()">
    <div class="tab-switch">
      <button class="tab-btn active" id="btnTabCard" onclick="switchView('card')">📇 카드 뷰</button>
      <button class="tab-btn" id="btnTabTable" onclick="switchView('table')">📋 테이블 뷰</button>
    </div>
  </div>

  <!-- 데이터 컨테이너 -->
  <div id="loading" style="text-align:center;padding:50px 0">
    <div class="spin"></div>
    <p style="color:var(--sub)">실시간 데이터를 불러오는 중...</p>
  </div>

  <div id="emptyView" class="empty-box" style="display:none">
    <div style="font-size:2.5rem;margin-bottom:10px">📝</div>
    <div style="font-size:1.1rem;font-weight:700;margin-bottom:6px">아직 풀이를 시작한 학생이 없습니다.</div>
    <p style="color:var(--sub);font-size:.9rem">학생들에게 링크나 QR 코드를 공유하면 이곳에 실시간으로 나타납니다.</p>
  </div>

  <!-- 카드 그리드 뷰 -->
  <div class="student-grid" id="cardContainer" style="display:none"></div>

  <!-- 테이블 뷰 -->
  <div id="tableContainer" style="display:none">
    <table>
      <thead>
        <tr>
          <th>학생명</th>
          <th>수업(방)</th>
          <th>퀴즈</th>
          <th>진행 단계</th>
          <th>맞힌 문항</th>
          <th>정답률</th>
          <th>상태</th>
          <th>마지막 활동</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbypyb4LXL-Jx6PhKhLSklRsBAvKQBcMxIOhkukH4gMV-yKmOt0KtPrpLS9XxBy8FHXXZg/exec';

let rawData = [];
let isAnonymous = false;
let currentView = 'card';
let urlParams = new URLSearchParams(window.location.search);
let targetRoom = (urlParams.get('room') || '').trim();

// 초기화
document.addEventListener('DOMContentLoaded', () => {
  setupRoomHeader();
  fetchData();
  // 3초 자동 폴링
  setInterval(fetchData, 3500);
});

function setupRoomHeader() {
  const bannerContainer = document.getElementById('roomBadgeContainer');
  const actionBar = document.getElementById('roomActionBar');
  const title = document.getElementById('dashboardTitle');
  const sub = document.getElementById('dashboardSubtitle');

  if (targetRoom) {
    bannerContainer.innerHTML = `<div class="room-banner">🏫 수업 코드: <b>${escapeHtml(targetRoom)}</b></div>`;
    title.innerHTML = `📊 [${escapeHtml(targetRoom)}] 실시간 수업 관제 센터`;
    sub.textContent = `현재 '${targetRoom}' 수업에 참여 중인 학생들의 학습 실황입니다.`;
    actionBar.style.display = 'flex';

    document.getElementById('btnProjector').onclick = () => openProjectorModal(targetRoom);
    document.getElementById('btnCopyStudentLink').onclick = copyCurrentStudentLink;
  } else {
    bannerContainer.innerHTML = '';
    title.textContent = '📊 전체 학습 현황 모니터링';
    sub.textContent = '개설된 모든 수업 및 자율 학습 학생들의 실황입니다.';
    actionBar.style.display = 'none';
  }
}

async function fetchData() {
  try {
    const res = await fetch(API_URL);
    const json = await res.json();
    rawData = json.items || [];
    render();
  } catch (err) {
    console.error('데이터 로드 실패:', err);
  }
}

// 데이터 파싱: student_name에서 [ROOM_ID] 추출
function parseItems(items) {
  return items.map(item => {
    let name = (item.student_name || '익명').toString().trim();
    let rId = (item.room_id || '').toString().trim();
    
    // name에 [ROOM_ID]가 포함되어 있는 경우 추출
    const match = name.match(/^(.*?)\s*\[([a-zA-Z0-9_\-\uAC00-\uD7A3]+)\]$/);
    if (match) {
      name = match[1].trim();
      if (!rId) rId = match[2].trim();
    }

    const cur = parseInt(item.current_step) || 0;
    const tot = parseInt(item.total_steps) || 0;
    const cor = parseInt(item.correct) || 0;
    const pct = tot > 0 ? Math.round((cor / tot) * 100) : 0;
    const progressPct = tot > 0 ? Math.round((cur / tot) * 100) : 0;

    return {
      ...item,
      parsed_name: name,
      parsed_room: rId,
      current_step: cur,
      total_steps: tot,
      correct: cor,
      pct: pct,
      progressPct: progressPct,
      is_done: tot > 0 && cur >= tot,
      updated_date: item.updated_at ? new Date(item.updated_at.replace(' ', 'T') + 'Z') : new Date()
    };
  });
}

function render() {
  document.getElementById('loading').style.display = 'none';
  const parsed = parseItems(rawData);

  // 방 목록 & 퀴즈 목록 셀렉트 채우기
  updateSelectOptions(parsed);

  // 필터 적용
  const filtered = filterData(parsed);

  // 통계 계산
  updateStats(filtered);

  if (filtered.length === 0) {
    document.getElementById('emptyView').style.display = 'block';
    document.getElementById('cardContainer').style.display = 'none';
    document.getElementById('tableContainer').style.display = 'none';
    return;
  }
  document.getElementById('emptyView').style.display = 'none';

  if (currentView === 'card') {
    renderCards(filtered);
    document.getElementById('cardContainer').style.display = 'grid';
    document.getElementById('tableContainer').style.display = 'none';
  } else {
    renderTable(filtered);
    document.getElementById('cardContainer').style.display = 'none';
    document.getElementById('tableContainer').style.display = 'block';
  }
}

function filterData(items) {
  const roomFilter = targetRoom || document.getElementById('roomFilterSelect').value.trim();
  const quizFilter = document.getElementById('quizFilterSelect').value.trim();
  const nameQuery = document.getElementById('nameFilterInput').value.trim().toLowerCase();

  return items.filter(it => {
    if (roomFilter && it.parsed_room.toLowerCase() !== roomFilter.toLowerCase()) return false;
    if (quizFilter && it.quiz_slug !== quizFilter) return false;
    if (nameQuery && !it.parsed_name.toLowerCase().includes(nameQuery)) return false;
    return true;
  });
}

function updateStats(items) {
  const total = items.length;
  const completed = items.filter(it => it.is_done).length;
  const completePct = total > 0 ? Math.round((completed / total) * 100) : 0;
  
  const avg = total > 0 ? Math.round(items.reduce((s, it) => s + it.pct, 0) / total) : 0;
  
  // 최근 3분 이내 활동한 학생
  const now = Date.now();
  const activeNow = items.filter(it => (now - it.updated_date.getTime()) < 3 * 60 * 1000).length;

  document.getElementById('statTotalStudents').textContent = total + '명';
  document.getElementById('statCompleted').textContent = `${completed}명 (${completePct}%)`;
  document.getElementById('statAvgScore').textContent = avg + '%';
  document.getElementById('statActiveNow').textContent = activeNow + '명';
}

function renderCards(items) {
  const container = document.getElementById('cardContainer');
  let html = '';

  items.forEach((it, idx) => {
    const displayName = isAnonymous ? `학생 ${idx + 1}` : escapeHtml(it.parsed_name);
    const statusClass = it.is_done ? 'status-done' : (isRecent(it.updated_date) ? 'status-active' : 'status-wait');
    const statusText = it.is_done ? '🎉 풀이 완료' : (isRecent(it.updated_date) ? '🟢 풀이 중' : '⏳ 대기');
    const timeAgo = formatTimeAgo(it.updated_date);

    html += `
      <div class="student-card">
        <div class="s-top">
          <div class="s-name">${displayName}</div>
          <span class="s-status ${statusClass}">${statusText}</span>
        </div>
        <div style="font-size:.82rem;color:var(--sub)">
          퀴즈: <code>${escapeHtml(it.quiz_slug)}</code>
          ${it.parsed_room ? `· 방: <b>${escapeHtml(it.parsed_room)}</b>` : ''}
        </div>
        <div class="s-bar-wrap">
          <div class="s-bar" style="width: ${it.progressPct}%"></div>
        </div>
        <div class="s-meta">
          <span>진도: <b>${it.current_step}/${it.total_steps}</b>단계</span>
          <span style="color:${it.pct >= 80 ? 'var(--good)' : (it.pct >= 50 ? 'var(--gold)' : 'var(--bad)')}">
            점수: <b>${it.correct}</b> (${it.pct}%)
          </span>
        </div>
        <div class="s-time">활동: ${timeAgo}</div>
      </div>
    `;
  });

  container.innerHTML = html;
}

function renderTable(items) {
  const tbody = document.getElementById('tableBody');
  let html = '';

  items.forEach((it, idx) => {
    const displayName = isAnonymous ? `학생 ${idx + 1}` : escapeHtml(it.parsed_name);
    const pillClass = it.pct >= 80 ? 'pill-high' : (it.pct >= 50 ? 'pill-mid' : 'pill-low');

    html += `
      <tr>
        <td style="font-weight:700">${displayName}</td>
        <td>${it.parsed_room ? `<span class="pill pill-high">${escapeHtml(it.parsed_room)}</span>` : '<span style="color:var(--sub)">자율학습</span>'}</td>
        <td><code>${escapeHtml(it.quiz_slug)}</code></td>
        <td><b>${it.current_step}</b> / ${it.total_steps}</td>
        <td>${it.correct}개 정답</td>
        <td><span class="pill ${pillClass}">${it.pct}%</span></td>
        <td>${it.is_done ? '<span style="color:var(--good);font-weight:700">완료</span>' : '진행중'}</td>
        <td style="color:var(--sub);font-size:.82rem">${formatTimeAgo(it.updated_date)}</td>
      </tr>
    `;
  });

  tbody.innerHTML = html;
}

function updateSelectOptions(items) {
  const roomSelect = document.getElementById('roomFilterSelect');
  const quizSelect = document.getElementById('quizFilterSelect');

  const rooms = Array.from(new Set(items.map(it => it.parsed_room).filter(Boolean))).sort();
  const quizzes = Array.from(new Set(items.map(it => it.quiz_slug).filter(Boolean))).sort();

  const prevRoom = roomSelect.value;
  const prevQuiz = quizSelect.value;

  if (roomSelect.options.length <= 1) {
    rooms.forEach(r => {
      const opt = document.createElement('option');
      opt.value = r;
      opt.textContent = `🏫 ${r} 수업`;
      if (r === targetRoom || r === prevRoom) opt.selected = true;
      roomSelect.appendChild(opt);
    });
  }

  if (quizSelect.options.length <= 1) {
    quizzes.forEach(q => {
      const opt = document.createElement('option');
      opt.value = q;
      opt.textContent = `📘 ${q}`;
      if (q === prevQuiz) opt.selected = true;
      quizSelect.appendChild(opt);
    });
  }
}

function onRoomSelectChange(val) {
  if (val) {
    window.location.search = `?room=${encodeURIComponent(val)}`;
  } else {
    window.location.search = '';
  }
}

function applyFilters() {
  render();
}

function switchView(v) {
  currentView = v;
  document.getElementById('btnTabCard').classList.toggle('active', v === 'card');
  document.getElementById('btnTabTable').classList.toggle('active', v === 'table');
  render();
}

function toggleAnonymous() {
  isAnonymous = !isAnonymous;
  const btn = document.getElementById('btnToggleAnon');
  btn.textContent = isAnonymous ? '🙈 익명 모드: ON' : '🙈 익명 모드: OFF';
  btn.classList.toggle('btn-active', isAnonymous);
  render();
}

function exportCsv() {
  const parsed = parseItems(rawData);
  const filtered = filterData(parsed);

  if (filtered.length === 0) {
    alert('내보낼 데이터가 없습니다.');
    return;
  }

  // UTF-8 BOM(\uFEFF) 추가하여 엑셀 한글 깨짐 방지
  let csv = '\uFEFF학생이름,수업코드,퀴즈코드,진행단계,총단계,맞힌문항,정답률(%),완료여부,최종활동시간\n';
  filtered.forEach(it => {
    csv += `"${it.parsed_name}","${it.parsed_room}","${it.quiz_slug}",${it.current_step},${it.total_steps},${it.correct},${it.pct},"${it.is_done ? '완료' : '진행중'}","${it.updated_at}"\n`;
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const filename = `${targetRoom ? targetRoom + '_' : ''}mathedu_성적표_${new Date().toISOString().slice(0,10)}.csv`;
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function copyCurrentStudentLink() {
  const slug = rawData.find(it => it.room_id === targetRoom || (it.student_name || '').includes(`[${targetRoom}]`))?.quiz_slug || '48d0d98f';
  const url = `${window.location.origin}${window.location.pathname.replace('dashboard-static.html', '')}board/${slug}.html?room=${encodeURIComponent(targetRoom)}`;
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('btnCopyStudentLink');
    const prev = btn.textContent;
    btn.textContent = '✅ 복사 완료!';
    setTimeout(() => { btn.textContent = prev; }, 1500);
  });
}

function openProjectorModal(rId) {
  const slug = rawData.find(it => it.room_id === rId || (it.student_name || '').includes(`[${rId}]`))?.quiz_slug || '48d0d98f';
  const url = `${window.location.origin}${window.location.pathname.replace('dashboard-static.html', '')}board/${slug}.html?room=${encodeURIComponent(rId)}`;
  const qrBig = `https://api.qrserver.com/v1/create-qr-code/?size=450x450&data=${encodeURIComponent(url)}`;

  const modal = document.createElement('div');
  modal.className = 'projector-modal';
  modal.id = 'projectorModal';
  modal.innerHTML = `
    <button onclick="document.getElementById('projectorModal').remove()" style="position:absolute;top:20px;right:24px;background:#222a3d;color:#fff;border:1px solid #2e3850;padding:10px 20px;border-radius:10px;font-size:1rem;cursor:pointer;font-weight:700">✕ 칠판 뷰 닫기</button>
    <div style="background:rgba(124,196,255,.2);color:#7cc4ff;border:1px solid rgba(124,196,255,.4);border-radius:30px;padding:8px 24px;font-size:1.2rem;font-weight:800;margin-bottom:16px">🏫 수업 코드: ${escapeHtml(rId)}</div>
    <h1 style="font-size:2.6rem;margin-bottom:10px;background:linear-gradient(90deg,#7cc4ff,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent">스마트폰 카메라로 QR 코드를 스캔하세요!</h1>
    <p style="color:#9aa6c0;font-size:1.2rem;margin-bottom:28px">회원가입 없이 즉시 참여할 수 있습니다.</p>
    <div style="background:#fff;padding:16px;border-radius:24px;box-shadow:0 0 60px rgba(124,196,255,.4);margin-bottom:24px">
      <img src="${qrBig}" style="width:340px;height:340px;display:block" alt="QR">
    </div>
    <div style="background:rgba(255,255,255,.08);padding:12px 28px;border-radius:12px;font-size:1.15rem;color:#7cc4ff;font-family:monospace">${escapeHtml(url)}</div>
  `;
  document.body.appendChild(modal);
}

function isRecent(d) {
  return (Date.now() - d.getTime()) < 3 * 60 * 1000;
}

function formatTimeAgo(d) {
  const diffSec = Math.floor((Date.now() - d.getTime()) / 1000);
  if (diffSec < 15) return '방금 전';
  if (diffSec < 60) return `${diffSec}초 전`;
  const diffMin = Math.floor(diffSec / 60);
  if (diffMin < 60) return `${diffMin}분 전`;
  const diffHr = Math.floor(diffMin / 60);
  if (diffHr < 24) return `${diffHr}시간 전`;
  return `${Math.floor(diffHr / 24)}일 전`;
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
