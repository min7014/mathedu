  <script>
  (function () {
    // 1. Register Official Service Worker for Google Play TWA & Offline PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }

    // 2. Android Hardware Back-Button Guard (prevents accidental app exit when closing sub-modals)
    try {
      history.pushState({ page: 'mathedu_game_root' }, '', location.href);
      window.addEventListener('popstate', function () {
        var scratch = document.getElementById('questScratchpadOverlay');
        if (scratch && scratch.style.display !== 'none') {
          scratch.style.display = 'none';
          history.pushState({ page: 'mathedu_game_root' }, '', location.href);
          return;
        }
        var modals = document.querySelectorAll('.mathedu-ad-modal-backdrop, .quest-submodal-backdrop');
        if (modals && modals.length > 0) {
          modals[modals.length - 1].remove();
          history.pushState({ page: 'mathedu_game_root' }, '', location.href);
        }
      });
    } catch (e) {}

    // 3. Native Install Prompt Hook
    var deferredPrompt = null;
    var installBtn = document.getElementById('btnInstallPwaApp');
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferredPrompt = e;
      if (installBtn) installBtn.style.display = 'inline-flex';
    });
    if (installBtn) {
      installBtn.addEventListener('click', function () {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.finally(function () {
          deferredPrompt = null;
          installBtn.style.display = 'none';
        });
      });
    }
  })();
  </script>
